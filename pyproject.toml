[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-workflow"
version = "0.10.2"
description = "Ticket-backed feature workspace lifecycle for Jujutsu"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Morgan" }]
keywords = ["jujutsu", "jj", "workspaces", "kanban", "tickets"]

[project.scripts]
jj-workflow = "jj_workflow.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
