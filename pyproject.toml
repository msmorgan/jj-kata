[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-kata"
version = "0.12.0"
description = "Safe Jujutsu workspace coordination for parallel agents, with optional file-backed Kanban"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Morgan" }]
keywords = ["jujutsu", "jj", "parallel", "workspaces", "kanban"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX",
]

[project.scripts]
kata = "jj_kata.cli:main"
jj-kata = "jj_kata.cli:main"

[project.optional-dependencies]
dev = [
  "PyYAML>=6",
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
