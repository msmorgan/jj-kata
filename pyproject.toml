[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-kata"
version = "0.11.0"
description = "Repeatable feature-workspace practice for Jujutsu"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Morgan" }]
keywords = ["jujutsu", "jj", "workspaces", "kanban", "tickets"]

[project.scripts]
jj-kata = "jj_kata.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
