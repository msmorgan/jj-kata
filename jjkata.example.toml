# Copy to jjkata.toml in a repository's default workspace. Every setting is optional.

# Keep claim markers on their feature line (default), or publish them through
# a bookmarked anchor on the default line with "shared".
visibility = "feature"

# Feature workspace base. Relative paths resolve from the default workspace.
workspace_dir = ".workspaces"

# Executable called after workspace creation with the new workspace path.
provision_hook = "scripts/provision-workspace"

# Optional. Omit this table for a pure workspace lifecycle with no item model.
# A docs/tickets directory never enables Kanban implicitly.
[items]
driver = "kanban" # or "scripts/items", or ["python3", "scripts/items.py"]

[kanban]
root = "docs/tickets"
wip = "wip"
done = "done"
patterns = ["*.md"]

# Optional presentation priority. Without it, columns are discovered and
# sorted, followed by WIP and done.
# columns = ["bugs", "critical", "planned", "maybe", "wip", "done"]

# Instead of the bundled inspector, delegate jj-kata kanban commands to a
# repository command. This is independent of [items].driver.
# command = "scripts/todo"
