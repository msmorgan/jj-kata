# Copy to kata.toml in a repository's default workspace. Every setting is optional.

# Feature workspace base. Relative paths resolve from the default workspace.
workspace_dir = ".workspaces"

# Executable called after workspace creation with the new workspace path.
# provision_hook = "scripts/provision-workspace"

# Descriptions for commits Kata creates. Available fields are {workspace} and
# {items}; {items} is a comma-separated list and is empty for start.
[messages]
start = "kata: start {workspace}"
claim = "kata: claim {items}"
complete = "kata: complete {items}"
return = "items: return {items}"

# Optional. Omit this table for a pure workspace lifecycle with no item model.
# A docs/tickets directory never enables Kanban implicitly.
[items]
driver = "kanban" # or "scripts/items", or ["python3", "scripts/items.py"]
# Keep claims on their feature line (default), or publish them through a
# bookmarked anchor on the default line. Bare `start` never creates an anchor.
visibility = "feature" # or "shared"

[kanban]
root = "docs/tickets"
wip = "wip"
done = "done"
patterns = ["*.md"]

# Optional dependency adapter. Kata invokes it once per ticket with the
# absolute ticket path; print direct dependency IDs one per line. When omitted,
# the bundled Markdown reader uses optional `needs: [item, ...]` frontmatter.
# needs_command = "scripts/ticket-needs"

# Optional presentation priority. Without it, columns are discovered and
# sorted, followed by WIP and done.
# columns = ["bugs", "critical", "planned", "maybe", "wip", "done"]

# Instead of the bundled inspector, delegate kata kanban commands to a
# repository command. This is independent of [items].driver.
# command = "scripts/todo"
